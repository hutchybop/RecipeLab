<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RecipeLab{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('web.index') }}">RecipeLab</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('web.generate_page') }}">Generate</a>
          <a class="nav-link" href="{{ url_for('web.import_recipe_page') }}">Import</a>
          <a class="nav-link" href="{{ url_for('web.suggestions_page') }}">Suggestions</a>
          <a class="nav-link" href="{{ url_for('web.recipes_page') }}">Recipe Library</a>
          <a class="nav-link" href="{{ url_for('web.profile_page') }}">Profile</a>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
