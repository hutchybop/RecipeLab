<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RecipeLab{% endblock %}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}" />
    <link rel="icon" href="{{ url_for('web.favicon') }}" sizes="any" />
    <link rel="manifest" href="{{ url_for('web.webmanifest') }}" />
    <meta name="msapplication-config" content="{{ url_for('web.browserconfig') }}" />
    <meta name="theme-color" content="#111827" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark.css') }}" />
  </head>
  <body class="app-body">
    <nav class="navbar navbar-expand-lg app-navbar border-bottom mb-4">
      <div class="container">
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="{{ url_for('web.index') }}">
          <img src="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" alt="RecipeLab icon" width="30" height="30" />
          <span>RecipeLab</span>
        </a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('web.generate_page') }}">Generate</a>
          <a class="nav-link" href="{{ url_for('web.import_recipe_page') }}">Import</a>
          <a class="nav-link" href="{{ url_for('web.suggestions_page') }}">Suggestions</a>
          <a class="nav-link" href="{{ url_for('web.recipes_page') }}">Recipe Library</a>
          <a class="nav-link" href="{{ url_for('web.profile_page') }}">Profile</a>
          <a class="nav-link" href="{{ url_for('web.settings_page') }}">Settings</a>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
